name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий вместе с C++ подмодулями
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Настраиваем Java 17 (требуется для современных проектов Gradle/Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Делаем gradlew исполняемым
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 4. Собираем Debug APK (NDK и CMake подтянутся автоматически)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. Сохраняем собранный APK в артефакты запуска
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
